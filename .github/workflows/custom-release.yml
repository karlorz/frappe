name: Custom Release

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Custom release notes'
        required: false
        type: string
        default: 'Custom frappe release based on upstream with additional features'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"

      - name: Determine version
        id: version
        run: |
          # Get latest non-dev tag (production releases)
          LATEST_TAG=$(git tag --sort=-version:refname | grep -v '\-dev$' | head -n 1)
          if [ -z "$LATEST_TAG" ]; then
            echo "No tags found, using default version"
            BASE_VERSION="15.78.1"
          else
            # Remove 'v' prefix if present
            BASE_VERSION=${LATEST_TAG#v}
          fi
          
          DEV_TAG="v${BASE_VERSION}-dev"
          
          # Check if -dev tag already exists
          if git tag | grep -q "^${DEV_TAG}$"; then
            echo "Tag ${DEV_TAG} already exists, incrementing patch version"
            # Parse version parts
            IFS='.' read -r major minor patch <<< "$BASE_VERSION"
            NEW_PATCH=$((patch + 1))
            BASE_VERSION="${major}.${minor}.${NEW_PATCH}"
            DEV_TAG="v${BASE_VERSION}-dev"
          fi
          
          echo "base_version=${BASE_VERSION}" >> $GITHUB_OUTPUT
          echo "dev_tag=${DEV_TAG}" >> $GITHUB_OUTPUT
          echo "Using version: ${BASE_VERSION}-dev (tag: ${DEV_TAG})"

      - name: Update version in frappe/__init__.py
        run: |
          sed -i "s/__version__ = .*/__version__ = \"${{ steps.version.outputs.base_version }}-dev\"/" frappe/__init__.py
          git add frappe/__init__.py
          git commit -m "chore(release): update version to ${{ steps.version.outputs.base_version }}-dev [skip ci]" || echo "No changes to commit"

      - name: Create and push tag
        run: |
          TAG_NAME="${{ steps.version.outputs.dev_tag }}"
          git tag $TAG_NAME
          git push origin $TAG_NAME

      - name: Create GitHub Release
        run: |
          TAG_NAME="${{ steps.version.outputs.dev_tag }}"
          BASE_VERSION="${{ steps.version.outputs.base_version }}"
          RELEASE_NOTES="${{ github.event.inputs.release_notes }}"
          
          if [ -z "$RELEASE_NOTES" ]; then
            RELEASE_NOTES="Custom frappe release v${BASE_VERSION}-dev based on upstream Frappe v${BASE_VERSION}

          ## Changes in this release:
          - Based on upstream Frappe v${BASE_VERSION}
          - Contains custom modifications and enhancements  
          - All custom features are preserved

          ## Installation:
          Use this release tag for your custom Frappe installation."
          fi
          
          gh release create $TAG_NAME \
            --title "Frappe v${BASE_VERSION}-dev" \
            --notes "$RELEASE_NOTES" \
            --target version-15-dev
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push version update
        run: |
          git push origin version-15-dev